name: Deploy GitHub Pages manually

# Publishing is possible only after an explicit manual workflow run.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check dependency tree
        run: npm ls --all

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check TypeScript and Astro
        run: npm run check

      - name: Build production site
        run: npm run build

      - name: Check GitHub Pages URLs
        run: npm run check:pages

      - name: Read existing GitHub Pages configuration
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved build
        id: deployment
        uses: actions/deploy-pages@v5.0.1
